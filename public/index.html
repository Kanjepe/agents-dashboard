<!doctype html>
<html lang="lv">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>TWINO Agents Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="/style.css" />
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              ink: { 950: '#0a0a0b', 900: '#111114', 800: '#1a1a1f', 700: '#26262d' },
              accent: { DEFAULT: '#7AB648', soft: '#9fd16b' },
              alert: '#ff5c7c',
              warn: '#f4b350',
              muted: '#8c8c98',
            },
            fontFamily: {
              mono: ['JetBrains Mono', 'Cascadia Code', 'Consolas', 'monospace'],
              sans: ['Inter', 'system-ui', 'sans-serif'],
            },
          },
        },
      };
    </script>
  </head>
  <body class="bg-ink-950 text-slate-100 font-sans antialiased min-h-screen">
    <div class="max-w-[1600px] mx-auto px-6 py-6">
      <header class="flex items-center justify-between mb-6">
        <div>
          <h1 class="text-2xl font-semibold tracking-tight">
            TWINO <span class="text-accent">Agents</span>
          </h1>
          <p class="text-sm text-muted mt-0.5" id="subtitle">
            Lokāls Claude Code sesiju monitors
          </p>
        </div>
        <div class="flex items-center gap-6">
          <div class="flex items-center gap-2 text-sm">
            <span id="conn-dot" class="w-2 h-2 rounded-full bg-warn animate-pulse"></span>
            <span id="conn-text" class="text-muted">connecting…</span>
          </div>
          <div class="flex items-center gap-4 text-xs font-mono text-muted">
            <span><span class="text-accent">●</span> <span id="count-active">0</span> active</span>
            <span><span class="text-warn">●</span> <span id="count-waiting">0</span> waiting</span>
            <span><span class="text-slate-500">●</span> <span id="count-idle">0</span> idle</span>
            <span class="text-slate-600">|</span>
            <span id="count-total">0</span> total
          </div>
        </div>
      </header>

      <div class="flex items-center gap-3 mb-4 text-xs">
        <button data-filter="active" class="filter-btn px-3 py-1.5 rounded-md bg-ink-800 hover:bg-ink-700 transition">
          Active
        </button>
        <button data-filter="waiting" class="filter-btn px-3 py-1.5 rounded-md bg-ink-800 hover:bg-ink-700 transition">
          Waiting
        </button>
        <button data-filter="recent" class="filter-btn px-3 py-1.5 rounded-md bg-ink-800 hover:bg-ink-700 transition">
          Recent
        </button>
        <button data-filter="idle" class="filter-btn px-3 py-1.5 rounded-md bg-ink-800 hover:bg-ink-700 transition">
          Idle
        </button>
        <button data-filter="all" class="filter-btn px-3 py-1.5 rounded-md bg-accent text-ink-950 font-medium transition">
          All
        </button>
        <div class="flex-1"></div>
        <span class="text-muted font-mono" id="last-update">—</span>
      </div>

      <main
        id="grid"
        class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-4"
      ></main>

      <p id="empty" class="hidden text-center text-muted py-16">
        Nav atrastu sesiju. Sāc Claude Code, un te tās parādīsies.
      </p>
    </div>

    <script type="module" src="/app.js"></script>
  </body>
</html>
